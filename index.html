<!doctype html>
<html lang="fr-BE" data-theme="graphite" data-density="comfortable">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7ce8ce">
  <meta name="description" content="Ultimate Dashboard V7 Nexus · santé, énergie, apprentissage, culture, corps, argent et trading dans une interface unique et automatisée.">
  <title>Ultimate Dashboard Nexus</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/v7/app.css?v=7.0.0">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="brand-mark" aria-hidden="true">UD</div>
        <div class="brand-copy"><b>Ultimate Dashboard</b><small>Nexus V7</small></div>
      </div>
      <nav class="nav" id="nav" aria-label="Navigation principale"></nav>
      <div class="sidebar-foot">Un runtime unique · données locales conservées · touche <b>/</b> pour la commande.</div>
    </aside>

    <header class="topbar">
      <div class="brand">
        <button type="button" class="icon-button menu-only" id="menu-button" aria-label="Ouvrir le menu">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="brand-mark" aria-hidden="true">UD</div>
        <div class="brand-copy"><b>Nexus <span id="version">7.0.0</span></b><small>Une interface · trois priorités</small></div>
      </div>
      <div class="top-actions">
        <span class="top-status" id="status">Nexus actif</span>
        <span class="clock" id="clock">--:--</span>
        <button type="button" class="icon-button" id="quick-button" aria-label="Ouvrir la capture rapide" title="Capture rapide">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button type="button" class="icon-button" id="command-button" aria-label="Ouvrir la palette de commandes" title="Palette de commandes">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        </button>
      </div>
    </header>

    <main class="main"><div id="app" class="app" aria-live="polite"></div></main>
  </div>

  <nav class="mobile-nav" id="mobile-nav" aria-label="Navigation mobile"></nav>
  <div id="overlay" class="overlay-root" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/v7/app.js?v=7.0.0"></script>
</body>
</html>
